name: Feature request
description: Suggest an improvement to Mengo Desktop
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory
        - Flow
        - Library
        - Runtime/Codex
        - Runtime/Claude Code
        - Packaging
        - Docs
        - Other
