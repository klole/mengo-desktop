name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show toolchain
        run: swift --version

      - name: Validate scripts and plist
        run: |
          bash -n bootstrap-cert.sh build-mengo.sh install.sh scripts/release-mengo.sh
          plutil -lint Resources/MengoDesktopInfo.plist

      - name: Run tests
        run: swift test

      - name: Compile release product
        run: swift build -c release --product MengoDesktop
