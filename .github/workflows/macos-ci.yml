name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        timeout-minutes: 10
        run: swift build
      - name: Test
        timeout-minutes: 10
        run: swift test
